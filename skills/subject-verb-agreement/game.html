    {title:&#x27;先找主语：谁在做？&#x27;,brief:&#x27;主语告诉我们“谁”；动词告诉我们“做什么”。&#x27;,choices:[&#x27;看她吃苹果&#x27;,&#x27;换成他们&#x27;],build:p=&gt;({icon:p?&#x27;👧👦&#x27;:&#x27;👧&#x27;,subject:p?&#x27;They&#x27;:&#x27;She&#x27;,verb:p?&#x27;eat&#x27;:&#x27;eats&#x27;,tail:&#x27;apples.&#x27;,labels:[&#x27;主语 · 谁吃？&#x27;,&#x27;动词 · 做什么？&#x27;,&#x27;吃什么？&#x27;],translation:p?&#x27;他们吃苹果。&#x27;:&#x27;她吃苹果。&#x27;,rule:&#x27;动词跟着主语变。先找 She / They，别盯着后面的 apples。&#x27;,note:&#x27;apples 的 s 表示不止一个苹果，是名词复数；eats 的 s 是动词变化，两个 s 管不同的事。&#x27;,transform:p?&#x27;They → eat（原形）&#x27;:&#x27;She → eat + s → eats&#x27;})},
    {title:&#x27;第三人称：我们在说谁？&#x27;,brief:&#x27;“第三”不是第三个人，也不是排第三名。&#x27;,choices:[&#x27;我 I&#x27;,&#x27;你 You&#x27;,&#x27;她 She&#x27;],build:p=&gt;({icon:[&#x27;🙋&#x27;,&#x27;🫵&#x27;,&#x27;👧&#x27;][p],subject:[&#x27;I&#x27;,&#x27;You&#x27;,&#x27;She&#x27;][p],verb:p===2?&#x27;likes&#x27;:&#x27;like&#x27;,tail:&#x27;apples.&#x27;,labels:[&#x27;主语&#x27;,&#x27;动词&#x27;,&#x27;&#x27;],translation:[&#x27;我喜欢苹果。&#x27;,&#x27;你喜欢苹果。&#x27;,&#x27;她喜欢苹果。&#x27;][p],rule:[&#x27;我 / 我们 → 第一人称：I / we。&#x27;,&#x27;你 / 你们 → 第二人称：you。&#x27;,&#x27;他 / 她 / 它 / 他们 → 第三人称：he / she / it / they。&#x27;][p],note:&#x27;说话的是“我”，听话的是“你”，我们谈到的“他、她、它”等属于第三人称。&#x27;,transform:p===2?&#x27;she 是第三人称，也是单数&#x27;:&#x27;I / you 不是第三人称&#x27;})},
    {title:&#x27;单数：是不是只有一个？&#x27;,brief:&#x27;第三人称 + 单数，两个条件都要满足。&#x27;,choices:[&#x27;Tom 一个人&#x27;,&#x27;Tom and Lily 两个人&#x27;,&#x27;You 一个人&#x27;,&#x27;My mum 我妈妈&#x27;],build:p=&gt;({icon:[&#x27;🧒&#x27;,&#x27;👦👧&#x27;,&#x27;🫵&#x27;,&#x27;👩&#x27;][p],subject:[&#x27;Tom&#x27;,&#x27;Tom and Lily&#x27;,&#x27;You&#x27;,&#x27;My mum&#x27;][p],verb:[0,3].includes(p)?&#x27;plays&#x27;:&#x27;play&#x27;,tail:&#x27;every day.&#x27;,labels:[&#x27;主语&#x27;,&#x27;动词&#x27;,&#x27;每天&#x27;],translation:[&#x27;汤姆每天玩耍。&#x27;,&#x27;汤姆和莉莉每天玩耍。&#x27;,&#x27;你每天玩耍。&#x27;,&#x27;我妈妈每天玩耍。&#x27;][p],rule:[&#x27;Tom = he → 第三人称单数。&#x27;,&#x27;Tom and Lily = they → 两个人，不是单数。&#x27;,&#x27;You 即使指一个人，也是第二人称，不是第三人称！&#x27;,&#x27;My mum = she → 第三人称单数；my 只是“我的”。&#x27;][p],note:&#x27;可以换成 he、she、it 的单个名字、动物或事物，通常也是第三人称单数：Lily、my dad、the cat。&#x27;,transform:[0,3].includes(p)?&#x27;play + s → plays&#x27;:&#x27;play → 保持原形&#x27;})},
    {title:&#x27;一般现在时：习惯、经常、事实&#x27;,brief:&#x27;这一关的“变身”，发生在一般现在时里。&#x27;,choices:[&#x27;她每天玩&#x27;,&#x27;她正在玩&#x27;,&#x27;她昨天玩了&#x27;],build:p=&gt;({icon:&#x27;👧&#x27;,subject:&#x27;She&#x27;,verb:[&#x27;plays&#x27;,&#x27;is playing&#x27;,&#x27;played&#x27;][p],tail:[&#x27;every day.&#x27;,&#x27;now.&#x27;,&#x27;yesterday.&#x27;][p],labels:[&#x27;主语&#x27;,&#x27;动词部分&#x27;,&#x27;时间线索&#x27;],translation:[&#x27;她每天玩耍。&#x27;,&#x27;她现在正在玩耍。&#x27;,&#x27;她昨天玩耍了。&#x27;][p],rule:[&#x27;一般现在时：常常做的事、习惯，也可以说事实和状态。&#x27;,&#x27;现在进行时：正在做，用 is playing；不能看见 she 就直接加 s。&#x27;,&#x27;一般过去时：昨天做的事，这里用 played；不能看见 she 就加 s。&#x27;][p],note:&#x27;“一般现在时”不等于“此刻正在做”。本游戏接下来重点练一般现在时；其他时态只用来对比。&#x27;,transform:[&#x27;play + s → plays&#x27;,&#x27;is + playing&#x27;,&#x27;play → played&#x27;][p]})},
    {title:&#x27;怎样变？先学 s 和 es&#x27;,brief:&#x27;已经确定要变身，现在才看动词的结尾。&#x27;,choices:[&#x27;大多数：+ s&#x27;,&#x27;ch / sh / s / x：+ es&#x27;,&#x27;go / do&#x27;],build:p=&gt;({icon:&#x27;🧩&#x27;,subject:&#x27;She&#x27;,verb:[&#x27;likes&#x27;,&#x27;watches&#x27;,&#x27;goes&#x27;][p],tail:[&#x27;apples.&#x27;,&#x27;TV every day.&#x27;,&#x27;home every day.&#x27;][p],labels:[&#x27;第三人称单数&#x27;,&#x27;变身后的动词&#x27;,&#x27;&#x27;],translation:[&#x27;她喜欢苹果。&#x27;,&#x27;她每天看电视。&#x27;,&#x27;她每天回家。&#x27;][p],rule:[&#x27;通常直接加 s：like → likes，eat → eats，run → runs。&#x27;,&#x27;常见结尾 ch、sh、s、x 加 es：watch → watches，wash → washes，miss → misses，fix → fixes。&#x27;,&#x27;这两个常用词单独记：go → goes，do → does。&#x27;][p],note:p===1?&#x27;这一关先记常见单词；遇到不熟悉的特殊词，再单独学习。&#x27;:p===2?&#x27;别把“所有 o 结尾都加 es”当成万能规则；先记熟 go 和 do。&#x27;:&#x27;不需要多放一个 e：like 本来就有 e，再加 s 就是 likes。&#x27;,transform:[&#x27;like + s → likes&#x27;,&#x27;watch + es → watches&#x27;,&#x27;go + es → goes&#x27;][p]})},

  function game(motion){if(s.pos&gt;=s.order.length){finish();return;}const id=s.order[s.pos],q=Q[id],done=s.pos+(s.solved?1:0),stage=[&#x27;认主语&#x27;,&#x27;选变身&#x27;,&#x27;小助手&#x27;,&#x27;综合挑战&#x27;];

  function finish(){content.innerHTML=`&lt;div class=&quot;vs-spacing vs-gap&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;vs-scene vs-motion&quot;&gt;&lt;h2 class=&quot;vs-actor&quot;&gt;🏅&lt;/h2&gt;&lt;h2&gt;动词变身小侦探&lt;/h2&gt;&lt;div&gt;${s.review?&#x27;错题挑战完成！&#x27;:&#x27;24 颗星星全部收集完成！&#x27;}&lt;/div&gt;&lt;div&gt;${s.review?&#x27;你又把容易混淆的地方练了一遍。&#x27;:`第一次就答对 ${s.first.length} / 24 题；经过练习，全部过关。`}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;vs-rule-list&quot;&gt;&lt;div&gt;&lt;span&gt;普通动词变第三人称单数形式&lt;/span&gt;&lt;span&gt;一般现在时 + 第三人称单数主语 + 肯定句&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;通常加 s；常见 ch / sh / s / x 加 es&lt;/span&gt;&lt;span&gt;likes · watches&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;辅音 + y → 去 y 加 ies；元音 + y → 加 s&lt;/span&gt;&lt;span&gt;studies · plays&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;常用变化单独记&lt;/span&gt;&lt;span&gt;goes · does · has&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;does / doesn’t / can 后面&lt;/span&gt;&lt;span&gt;动词用原形&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;viz-controls&quot;&gt;${s.mistakes.length?b(&#x27;再练容易错的 &#x27;+s.mistakes.length+&#x27; 题&#x27;,&#x27;data-action=&quot;review&quot;&#x27;,true):&#x27;&#x27;}${b(&#x27;重新收集星星&#x27;,&#x27;data-action=&quot;restart&quot;&#x27;)}${b(&#x27;回句子实验室&#x27;,&#x27;data-mode=&quot;lab&quot;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
  root.addEventListener(&#x27;click&#x27;,ev=&gt;{const el=ev.target.closest(&#x27;button&#x27;);if(!el||el.disabled)return;
    if(el.dataset.mode){s.mode=el.dataset.mode;changed();return;}

    if(el.dataset.form){s.form=el.dataset.form;changed(true);return;}
    if(el.dataset.answer!==undefined){const id=s.order[s.pos],q=Q[id];if(s.solved||!q)return;const value=q.choices[Number(el.dataset.answer)];if(value===q.answer){s.solved=true;if(s.attempts===0&amp;&amp;!s.first.includes(id)&amp;&amp;!s.review)s.first.push(id);changed(true);announce.textContent=&#x27;答对了！&#x27;+q.why;content.querySelector(&#x27;[data-action=&quot;next-question&quot;]&#x27;).focus();}else{s.attempts++;if(!s.mistakes.includes(id))s.mistakes.push(id);const feedback=content.querySelector(&#x27;#vs-feedback&#x27;);feedback.innerHTML=&#x27;&lt;div&gt;🐰 还差一点，再想想。&lt;/div&gt;&lt;p&gt;&#x27;+q.why+&#x27;&lt;/p&gt;&#x27;;announce.textContent=&#x27;还差一点。&#x27;+q.why;save();}return;}
    switch(el.dataset.action){case &#x27;previous&#x27;:s.lesson=Math.max(0,s.lesson-1);s.pick=0;break;case &#x27;next-lesson&#x27;:if(s.lesson===7)s.mode=&#x27;lab&#x27;;else{s.lesson++;s.pick=0;}break;case &#x27;hint&#x27;:content.querySelector(&#x27;#vs-feedback&#x27;).textContent=&#x27;💡 &#x27;+Q[s.order[s.pos]].hint;return;case &#x27;next-question&#x27;:if(!s.solved)return;s.pos++;s.solved=false;s.attempts=0;break;case &#x27;restart&#x27;:s.order=Q.map((_,i)=&gt;i);s.pos=0;s.solved=false;s.attempts=0;s.first=[];s.mistakes=[];s.review=false;break;case &#x27;review&#x27;:s.order=[...s.mistakes];s.pos=0;s.solved=false;s.attempts=0;s.review=true;break;default:return;}
    changed(true);
  });
  root.addEventListener(&#x27;change&#x27;,ev=&gt;{const el=ev.target;if(el.id===&#x27;vs-lesson&#x27;){s.lesson=Number(el.value);s.pick=0;}else if(el.id===&#x27;vs-subject&#x27;)s.subject=Number(el.value);else if(el.id===&#x27;vs-verb&#x27;)s.verb=Number(el.value);else return;changed(true);});
  window.addEventListener(&#x27;openai:set_globals&#x27;,ev=&gt;{if(ev.detail?.globals?.widgetState){restore(ev.detail.globals.widgetState);render();}});
  render();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
